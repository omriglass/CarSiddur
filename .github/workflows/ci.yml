name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Nightly full run (e2e) at 03:00 Asia/Jerusalem ≈ 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate — mirrors `npm run check` plus the two "generated file is fresh"
  # checks (docs/REFACTOR_PLAN_2026-09-11.md B2): the solver bundle the Edge
  # Functions run must match src/solver, and the bundle must never be hand-edited.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # impact.mjs diffs against origin/main (docs/TEST_MAP.md); needs real history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Solver bundle is fresh
        run: |
          npm run functions:bundle
          git diff --exit-code -- supabase/functions/_shared/ \
            || { echo "::error::supabase/functions/_shared/solver.js is stale — run 'npm run functions:bundle' and commit"; exit 1; }

      - name: Build
        run: npm run build

      - name: Change impact (docs/TEST_MAP.md) — informational, fails only on unmapped files
        run: npm run impact -- --strict origin/main

      - name: Migration guard (docs/RUNBOOK_ROLLBACK.md, supabase/rollback/README.md)
        # Flags a new migration that drops/renames without a matching tested
        # down script — forward-fix rule, owner decision 2026-09-14 #4. Same
        # base ref as the impact step above; on a release tag (release.mjs
        # only tags a commit that is already on origin/main) this is an empty,
        # harmless diff.
        run: node scripts/check-migrations.mjs origin/main

  # Database gate (B3): replay every migration + seed on a throwaway local
  # Supabase stack, verify the committed generated types match the schema,
  # and run the SQL regression suites (RLS smoke, solver persistence, …).
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase (applies migrations + seed)
        run: supabase start -x studio,imgproxy,logflare,vector

      - name: Generated types are fresh
        run: |
          npm run db:types
          git diff --exit-code -- src/integrations/supabase/types.ts \
            || { echo "::error::src/integrations/supabase/types.ts is stale — run 'npm run db:types' and commit"; exit 1; }

      - name: SQL regression suites
        run: npm run db:test

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # Gated frontend promotion (docs/RUNBOOK_ROLLBACK.md, owner decisions
  # 2026-09-14 #1/#2). Only runs for a `vYYYY.MM.DD-n` release tag pushed by
  # `npm run release`, and only after `check` + `database` both pass. The
  # `production` environment requires the owner as a reviewer (set up once,
  # by hand, in GitHub → Settings → Environments → production → Required
  # reviewers — see docs/FREE_DEPLOYMENT.md "One-time setup for the gated
  # flow"): the job pauses here until they click Approve. THAT CLICK is the
  # one and only "deploy frontend" action — nothing reaches Cloudflare before
  # it. Approving fast-forwards `production`, which is the only branch
  # Cloudflare builds the `carsiddur` Worker from.
  promote:
    needs: [check, database]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the tag is on origin/main
        # A release tag must point at a commit origin/main already has —
        # release.mjs only tags after confirming the local tree matches
        # origin/main (step 1). This is a second, independent check here in
        # CI: refuse to promote a tag created any other way (e.g. tagged from
        # a stale or divergent local branch).
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit $GITHUB_SHA is not an ancestor of origin/main — refusing to promote. See docs/RUNBOOK_ROLLBACK.md."
            exit 1
          fi

      - name: Fast-forward production to this tag
        run: |
          if ! git push origin "$GITHUB_SHA:production"; then
            echo "::error::Fast-forward push to 'production' failed — it is likely not a fast-forward (production has commits this tag doesn't). Never force-push here; see the decision tree in docs/RUNBOOK_ROLLBACK.md."
            exit 1
          fi

  # Browser end-to-end suite (B3). Runs nightly and on demand, not on every
  # push: the suite is serial (workers=1, see playwright.config.ts) and takes
  # several minutes. Uses the local stack's well-known development keys.
  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Write Edge Function secrets for the local stack
        # e2e/helpers.ts reads CRON_SECRET from this gitignored file and wires
        # app_settings/app_secrets so cancel_ride()'s pg_net call reaches the local
        # on-ride-cancelled function; the edge runtime container loads the same file.
        # VAPID keys are a throwaway P-256 pair so push subscription code paths run.
        run: |
          node -e '
            const { generateKeyPairSync } = require("node:crypto");
            const fs = require("node:fs");
            const { publicKey, privateKey } = generateKeyPairSync("ec", { namedCurve: "prime256v1" });
            const pubJwk = publicKey.export({ format: "jwk" });
            // Web Push wants the raw uncompressed P-256 point (0x04 || X || Y) as base64url.
            const pub = Buffer.concat([Buffer.from([4]), Buffer.from(pubJwk.x, "base64url"), Buffer.from(pubJwk.y, "base64url")]).toString("base64url");
            const priv = privateKey.export({ format: "jwk" }).d;
            fs.writeFileSync("supabase/functions/.env", `VAPID_PUBLIC_KEY=${pub}\nVAPID_PRIVATE_KEY=${priv}\nVAPID_SUBJECT=mailto:ci@example.invalid\nCRON_SECRET=ci-cron-secret-${Date.now()}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `VITE_VAPID_PUBLIC_KEY=${pub}\n`);
          '

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,logflare,vector

      - name: Write .env from the local stack
        run: |
          supabase status -o env > /tmp/supabase.env
          . /tmp/supabase.env
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "VITE_VAPID_PUBLIC_KEY=$VITE_VAPID_PUBLIC_KEY"
            echo "VITE_APP_URL=http://localhost:8080"
          } > .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Playwright
        run: npm run test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
